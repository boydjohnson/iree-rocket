[package]
name = "rocket-hal-driver"
version = "0.1.0"
edition = "2024"

[lib]
# staticlib, not cdylib: confirmed directly from IREE's own source
# (runtime/src/iree/hal/drivers/{CMakeLists.txt,init_external.c.in}) that
# there is no dlopen-based HAL driver plugin mechanism anywhere in
# driver_registry.c/init.c -- iree_register_external_hal_driver() is a
# CMake-time static-link mechanism: it expects a static library target
# name and a register function resolved at LINK time, then generates
# init_external.c with a direct `extern` call to it. (The dlopen
# mechanisms that do exist in IREE are unrelated: CUDA/HIP/Vulkan/AMDGPU
# drivers dlopen their own vendor SDKs, and iree/hal/local/plugins/
# system_library_plugin.c dlopens precompiled *kernels* for the CPU
# driver's executable loader -- neither is HAL driver registration.)
# rlib kept alongside for `cargo check`/internal testing without needing
# the CMake side built.
crate-type = ["staticlib", "rlib"]

[dependencies]
iree-rocket-hal = { path = "../iree-rocket-hal" }
nix = { version = "0.30.1", features = ["mman", "sched"] }
rocket-schema = { path = "../rocket-schema" }

[build-dependencies]
bindgen = "0.72.1"

[dev-dependencies]
flatbuffers = "=2.0.0"
