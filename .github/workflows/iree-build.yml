name: IREE build (reusable)

# Builds one of the two CMake/Ninja configurations this repo produces:
#
#   compiler-host    iree-compile with the Rocket compiler target plugin
#                    registered -- ../../iree-build/configure-compiler-host.sh
#                    -- plus rocket-compiler, the Rust driver over the same
#                    libIREECompiler.so, packaged so an unpacked tarball
#                    compiles a model with no environment setup. Built
#                    natively for whatever the runner is: x86_64 on
#                    ubuntu-24.04 (iree-compile-x86_64, plus the host tools
#                    runtime-aarch64 imports), aarch64 on ubuntu-24.04-arm
#                    (iree-compile-aarch64; the nightly no longer runs it, see
#                    nightly.yml). Each also builds, installs and tests the
#                    rocket-compiler .deb from that same IREE build.
#   runtime-aarch64  iree-run-module / iree-benchmark-module cross-compiled for
#                    the RK3588 board with the Rocket HAL driver statically
#                    linked -- ../../iree-build/configure-runtime-aarch64.sh --
#                    plus the embeddable runtime package (rocket-runtime/),
#                    the rocket HAL CTS binaries and the Rust test binaries,
#                    all for the board.
#   runtime-deb      the runtime's Debian packages (libiree-rocket-runtime<N>,
#                    -dev, iree-rocket-tools), built natively on an arm64
#                    runner with the pkg.iree-rocket.nocompiler profile -- no
#                    LLVM, so minutes -- then installed with apt and run
#                    through debian/tests on the CPU device.
#
# runtime-aarch64 is downstream of compiler-host: configure-runtime-aarch64.sh
# points IREE_HOST_BIN_DIR at iree-build/build/tools, and IREE resolves those
# host tools straight out of that directory at configure time (see
# iree-src/build_tools/cmake/iree_import_binary.cmake -- it only sets an
# IMPORTED_LOCATION, it does not copy). So the caller must run compiler-host
# first (see nightly.yml) and this workflow unpacks that job's iree-host-tools
# artifact back into iree-build/build/ before configuring.

on:
  workflow_call:
    inputs:
      target:
        description: "compiler-host, runtime-aarch64 or runtime-deb"
        required: true
        type: string
      timeout-minutes:
        description: >-
          Job timeout. Deliberately under GitHub's 6h ceiling: on a cold ccache
          this build compiles all of LLVM, and a job killed at the hard ceiling
          would lose the ccache save step (and with it hours of work) whereas
          one that hits its own timeout still runs it.
        required: false
        default: 330
        type: number
      retention-days:
        description: "Retention for the published artifacts."
        required: false
        default: 14
        type: number
      runner:
        description: >-
          Runner image. Pinned, never ubuntu-latest: the image's glibc becomes
          the floor of every binary built on it -- the host compiler links
          against it, and the aarch64 cross toolchain ships the same release's
          libc6-arm64-cross -- and the binaries have to run on the developer
          host and the board. ubuntu-latest moved to 26.04 (glibc 2.43) in
          November 2026 and from then on no artifact ran on either. Keep this
          in step with max-glibc below; it is also part of the ccache key,
          since a different image means a different gcc and so no hits.
        required: false
        default: ubuntu-24.04
        type: string
      max-glibc:
        description: >-
          Newest GLIBC_x.y symbol version a shipped binary may require; the
          packaging steps fail the job above it. 2.39 is ubuntu-24.04's own,
          and at or under both consumers: the developer host (Ubuntu 24.04,
          2.39) and the board (Debian 13, 2.41).
        required: false
        default: "2.39"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.target }} (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Every target/runner pair gets its own cache (different compilers
      # entirely -- x86_64 g++, aarch64 g++, aarch64-linux-gnu-g++), and
      # their sum (3 + 3 + 1 + 0.5 GB for the four nightly jobs) has to stay
      # well under GitHub's 10 GB per-repo cache budget or the jobs evict
      # each other's LLVM objects every run.
      CCACHE_MAXSIZE: ${{ inputs.target == 'compiler-host' && '3G' || inputs.target == 'runtime-aarch64' && '1G' || '500M' }}
      CCACHE_COMPRESS: "1"
      # Rewrite absolute paths under the workspace to relative ones, so objects
      # stay reusable if the checkout ever lands somewhere else.
      CCACHE_BASEDIR: ${{ github.workspace }}
      # Submodule checkouts get fresh mtimes/ctimes on every run, which would
      # otherwise miss on every header. Safe here: nothing in IREE's build
      # depends on __DATE__/__TIME__ for correctness of the cached object.
      CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime,locale
      CCACHE_COMPILERCHECK: content

    steps:
      # Every build step below is gated on `if: inputs.target == ...`, so a
      # typo'd target would otherwise produce a green job that built nothing.
      - name: Validate target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            compiler-host|runtime-aarch64|runtime-deb) ;;
            *) echo "::error::unknown target '$TARGET'"; exit 1 ;;
          esac
          # runtime-aarch64 cross-compiles with aarch64-linux-gnu-g++ and
          # imports x86_64 host tools; on an arm runner neither holds.
          if [ "$TARGET" = runtime-aarch64 ] && [ "${RUNNER_ARCH}" != X64 ]; then
            echo "::error::runtime-aarch64 needs an x86_64 runner, not ${RUNNER_ARCH}"
            exit 1
          fi
          # The runtime packages are arm64 only, and built natively.
          if [ "$TARGET" = runtime-deb ] && [ "${RUNNER_ARCH}" != ARM64 ]; then
            echo "::error::runtime-deb needs an arm64 runner, not ${RUNNER_ARCH}"
            exit 1
          fi
          # compiler-host builds for the runner it is on; the package is named
          # after that architecture (iree-compile-x86_64 / -aarch64).
          echo "COMPILER_PKG=iree-compile-$(uname -m)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          # iree-src pulls in llvm-project and friends; the IREE builds need
          # all of them, so this cannot be narrowed to the top-level
          # submodule. runtime-deb is the exception: see the next step.
          submodules: ${{ inputs.target == 'runtime-deb' && 'false' || 'recursive' }}

      # The runtime build (tests off) reads only three of IREE's submodules,
      # the same ones debian/make-orig.sh ships for it. Skipping the rest
      # skips LLVM and torch-mlir's own nested LLVM, most of the checkout.
      - name: Check out the runtime's submodules
        if: inputs.target == 'runtime-deb'
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 iree-build/iree-src
          git -C iree-build/iree-src submodule update --init --depth 1 \
            third_party/flatcc third_party/benchmark third_party/googletest

      # Feeds the ccache key below. iree-src's SHA is what actually decides
      # whether the LLVM objects in the cache are still usable, so it belongs
      # in the key -- keying on ${{ github.sha }} would throw away the whole
      # LLVM build on every unrelated Rust-side commit.
      - name: Record iree-src pin
        id: pin
        run: |
          sha="$(git -C iree-build/iree-src rev-parse HEAD)"
          echo "iree_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "iree_describe=$(git -C iree-build/iree-src describe --tags --always)" >> "$GITHUB_OUTPUT"

      # A full LLVM + IREE build tree is ~4 GB and the ccache another ~3 GB, on
      # a runner image that ships with only ~21 GB free. These are the largest
      # preinstalled toolchains none of this build touches.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # patchelf: iree-compile is a thin wrapper that loads
          # libIREECompiler.so through an absolute RUNPATH baked in at link
          # time; the packaging step below rewrites it to $ORIGIN/../lib.
          # libclang-dev: bindgen runs from build.rs on both sides --
          # rocket-compiler (host) and iree-rocket-hal / rocket-hal-driver
          # (aarch64); see ci.yml's own note. pkg-config: the runtime package
          # link test (aarch64) resolves the package's .pc files with it.
          # debhelper, help2man: the .deb builds (debian/rules).
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache patchelf libclang-dev pkg-config \
            debhelper help2man

      - name: Install aarch64 cross toolchain
        if: inputs.target == 'runtime-aarch64'
        run: |
          # aarch64_linux_gnu.cmake relies on these packages' built-in sysroot
          # search paths -- no separate --sysroot configuration.
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # Both targets run cargo, and both from inside CMake as well as directly:
      #   compiler-host    the Rocket plugin's CMake builds rocket-plan-ffi
      #                    (find_program(cargo REQUIRED), linked into
      #                    libIREECompiler.so), and rocket-compiler is built
      #                    below.
      #   runtime-aarch64  rocket-hal-driver's staticlib is built by cargo from
      #                    within that CMake tree, and the crates' own test
      #                    binaries are built below.
      # So this has to run before either Configure step. Pinned rather than
      # `stable` so a Rust release cannot change what a nightly ships between
      # two runs of the same commit; bump it deliberately.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: ${{ inputs.target == 'runtime-aarch64' && 'aarch64-unknown-linux-gnu' || '' }}

      - uses: Swatinem/rust-cache@v2
        if: inputs.target == 'runtime-aarch64'

      # Split restore/save rather than actions/cache, so a build that fails or
      # times out still banks the objects it did manage to compile. On a cold
      # cache this build is hours long; losing all of it to one bad commit at
      # the end would make the next run just as slow.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # github.run_id makes every run's key unique, because cache entries
          # are immutable -- reusing an existing key would silently skip the
          # save and the cache would never pick up newly compiled objects.
          key: ccache-${{ inputs.target }}-${{ inputs.runner }}-${{ steps.pin.outputs.iree_sha }}-${{ hashFiles('iree-build/configure-compiler-host.sh', 'iree-build/configure-runtime-aarch64.sh', 'iree-build/aarch64_linux_gnu.cmake', 'iree-build/host-aarch64/CMakeLists.txt') }}-${{ github.run_id }}
          # Falling back across iree-src SHAs is deliberate: an IREE bump moves
          # relatively few translation units, so a previous pin's cache still
          # hits on the vast majority of LLVM.
          restore-keys: |
            ccache-${{ inputs.target }}-${{ inputs.runner }}-${{ steps.pin.outputs.iree_sha }}-${{ hashFiles('iree-build/configure-compiler-host.sh', 'iree-build/configure-runtime-aarch64.sh', 'iree-build/aarch64_linux_gnu.cmake', 'iree-build/host-aarch64/CMakeLists.txt') }}-
            ccache-${{ inputs.target }}-${{ inputs.runner }}-${{ steps.pin.outputs.iree_sha }}-
            ccache-${{ inputs.target }}-${{ inputs.runner }}-

      - name: Reset ccache stats
        run: ccache --zero-stats

      # ---------------------------------------------------------------- host

      - name: Configure (compiler-host)
        if: inputs.target == 'compiler-host'
        run: |
          ./iree-build/configure-compiler-host.sh \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DIREE_BUILD_TESTS=OFF \
            -DIREE_BUILD_SAMPLES=OFF \
            -DIREE_BUILD_DOCS=OFF
        # IREE_BUILD_TESTS=OFF is a large time saving and costs nothing here:
        # this job exists to produce iree-compile plus the host tools the
        # aarch64 job imports, and rocket-compiler-plugin's own lit tests are
        # already gated on IREE_BUILD_TESTS (iree_compiler_plugin.cmake). The
        # aarch64 job keeps tests ON -- that is what builds the CTS.

      - name: Build (compiler-host)
        if: inputs.target == 'compiler-host'
        run: cmake --build iree-build/build

      # Not through CMake: rocket-compiler dlopens libIREECompiler.so at run
      # time rather than linking it, so it builds independently of the tree
      # above and only has to be packaged next to it.
      - name: Build rocket-compiler
        if: inputs.target == 'compiler-host'
        run: cargo build -p rocket-compiler --release --locked

      - name: Package compiler-host artifacts
        if: inputs.target == 'compiler-host'
        env:
          MAX_GLIBC: ${{ inputs.max-glibc }}
        run: |
          set -euo pipefail
          BUILD=iree-build/build

          # iree-compile and the other driver binaries are ~16 KB wrappers
          # around libIREECompiler.so, found via a RUNPATH holding this
          # runner's absolute build path. Rewrite it to $ORIGIN/../lib so both
          # consumers work: the downloadable tarball (unpacked anywhere) and
          # the aarch64 job (which unpacks to the same layout but must not
          # depend on the two runners agreeing on workspace paths).
          for f in "${BUILD}"/tools/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            # Doubles as the ELF check: patchelf fails on anything else.
            patchelf --print-rpath "$f" >/dev/null 2>&1 || continue
            patchelf --set-rpath '$ORIGIN/../lib' "$f"
          done

          write_version() {
            cat > "$1" <<EOF
          repo:     ${{ github.repository }}@${{ github.sha }}
          iree-src: ${{ steps.pin.outputs.iree_sha }} (${{ steps.pin.outputs.iree_describe }})
          built:    $(date -u +%Y-%m-%dT%H:%M:%SZ)
          run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          }

          # 1. The user-facing compiler: rocket-compiler and iree-compile,
          #    the shared library both load, and what that library and
          #    rocket-compiler look up at run time. rocket-compiler rides in
          #    this tarball rather than a sibling one because it is useless
          #    without the ~300 MB libIREECompiler.so; two artifacts would
          #    mean shipping that twice or making users assemble the layout.
          #
          #    Every path below is load-bearing:
          #      bin/rocket-compiler   finds ../lib/libIREECompiler.so and
          #                            ../share/rocket/<spec> beside itself
          #                            (rocket-compiler/src/main.rs,
          #                            PACKAGED_LIB / PACKAGED_SPEC).
          #      bin/iree-lld          libIREECompiler.so looks for it at
          #                            <its dir>/../bin/ (IREE's
          #                            findToolFromDylibDir); without it every
          #                            embedded CPU link fails unless one is
          #                            on PATH. RUNPATH already rewritten by
          #                            the loop above.
          OUT="dist/${COMPILER_PKG}"
          mkdir -p "${OUT}/bin" "${OUT}/lib" "${OUT}/share/rocket"
          cp "${BUILD}/tools/iree-compile" "${BUILD}/tools/iree-lld" "${OUT}/bin/"
          cp target/release/rocket-compiler "${OUT}/bin/"
          cp "${BUILD}/lib/libIREECompiler.so" "${OUT}/lib/"
          cp rocket-compiler-plugin/target/Rocket/rocket_conv2d_transform_spec.mlir \
             "${OUT}/share/rocket/"
          cp "${BUILD}/tools/build_config.txt" "${OUT}/"
          write_version "${OUT}/VERSION.txt"
          {
          echo "# rocket-compiler / iree-compile (${COMPILER_PKG#iree-compile-})"
          cat <<'EOF'

          Unpack anywhere; nothing needs to be set in the environment.

          ```sh
          bin/rocket-compiler compile --input model.mlir --output model.vmfb \
            --llvmcpu-target-triple aarch64-linux-gnu

          # The like-for-like CPU-only baseline, and the placement report:
          bin/rocket-compiler compile --input model.mlir --output cpu.vmfb \
            --llvmcpu-target-triple aarch64-linux-gnu --no-offload
          bin/rocket-compiler audit --input model.mlir
          ```

          `rocket-compiler` loads `lib/libIREECompiler.so` and the transform
          spec in `share/rocket/` relative to its own location; the
          `--iree-compiler-lib` / `IREE_COMPILER_LIB` and `--transform-spec`
          overrides still win when given. Use `rocket-compiler`, not
          `iree-compile`, for models: it pins placement between two pipeline
          stages, which a single `iree-compile` invocation cannot do.
          EOF
          } > "${OUT}/RUN.md"
          tar -C dist -czf "${COMPILER_PKG}.tar.gz" "${COMPILER_PKG}"
          CHECK=("dist/${COMPILER_PKG}")

          # 2. The full tools/ directory, in the exact layout
          #    IREE_HOST_BIN_DIR expects, for the aarch64 job to restore.
          #    lib/ rides along because iree-compile is imported from here and
          #    the check-test modules in the aarch64 tree actually run it.
          #    x86_64 only: runtime-aarch64 runs on an x86_64 runner, so these
          #    are the only host tools it can execute.
          if [ "${RUNNER_ARCH}" = X64 ]; then
            mkdir -p dist/iree-host-tools/tools dist/iree-host-tools/lib
            find "${BUILD}/tools" -maxdepth 1 -type f -executable \
              -exec cp {} dist/iree-host-tools/tools/ \;
            cp "${BUILD}/tools/build_config.txt" dist/iree-host-tools/tools/
            cp "${BUILD}/lib/libIREECompiler.so" dist/iree-host-tools/lib/
            write_version dist/iree-host-tools/VERSION.txt
            tar -C dist -czf iree-host-tools.tar.gz iree-host-tools
            CHECK+=(dist/iree-host-tools)
          fi

          # Before upload: a binary the host cannot load fails the job here
          # rather than in a user's shell (see the `runner` input).
          .github/scripts/check-glibc-ceiling.sh "${MAX_GLIBC}" "${CHECK[@]}"

          ls -lh ./*.tar.gz

      # The tarball as a user gets it: unpacked somewhere unrelated, with an
      # empty environment, so neither IREE_COMPILER_LIB nor a PATH entry can
      # stand in for the packaged layout. The checkout's own copy of the spec
      # is moved aside first: the binary still carries that source path as its
      # last fallback, and on this runner it exists, so it would otherwise
      # hide a broken packaged lookup. --no-offload also prints the path of
      # the spec it derived from, which is checked to be the packaged one.
      - name: Smoke-test the packaged rocket-compiler
        if: inputs.target == 'compiler-host'
        run: |
          set -euo pipefail
          SMOKE="${RUNNER_TEMP}/rocket-compiler-smoke"
          rm -rf "${SMOKE}" && mkdir -p "${SMOKE}"
          tar -xzf "${COMPILER_PKG}.tar.gz" -C "${SMOKE}"
          cp rocket-compiler-plugin/test/rocket_conv_layout.mlir "${SMOKE}/model.mlir"

          SPEC=rocket-compiler-plugin/target/Rocket/rocket_conv2d_transform_spec.mlir
          mv "${SPEC}" "${SPEC}.smoke-hidden"
          trap 'mv "${GITHUB_WORKSPACE}/${SPEC}.smoke-hidden" "${GITHUB_WORKSPACE}/${SPEC}"' EXIT

          cd "${SMOKE}"
          run() { env -i PATH=/usr/bin:/bin HOME="${HOME}" "$@"; }

          run "${COMPILER_PKG}/bin/rocket-compiler" compile \
            --input model.mlir --output offload.vmfb \
            --llvmcpu-target-triple aarch64-linux-gnu
          test -s offload.vmfb

          run "${COMPILER_PKG}/bin/rocket-compiler" compile \
            --input model.mlir --output no-offload.vmfb \
            --llvmcpu-target-triple aarch64-linux-gnu --no-offload 2>&1 \
            | tee no-offload.log
          test -s no-offload.vmfb
          grep -q 'share/rocket/rocket_conv2d_transform_spec.mlir' no-offload.log \
            || { echo "::error::--no-offload did not derive from the packaged spec"; exit 1; }

          ls -l ./*.vmfb

      # Everything is uploaded as a tarball rather than a bare directory:
      # actions/upload-artifact zips its input and the zip round-trip drops the
      # executable bit, which would make every one of these downloads useless.
      # compression-level 0 because the tarballs are already gzipped.
      - name: Upload iree-compile + rocket-compiler
        if: inputs.target == 'compiler-host'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMPILER_PKG }}
          path: ${{ env.COMPILER_PKG }}.tar.gz
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

      - name: Upload host tools
        if: inputs.target == 'compiler-host' && runner.arch == 'X64'
        uses: actions/upload-artifact@v4
        with:
          name: iree-host-tools
          path: iree-host-tools.tar.gz
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

      # The rocket-compiler .deb, packaging the IREE build above rather than
      # building another (ROCKET_IREE_BUILD_DIR), so it adds minutes, not
      # hours. debian/rules runs the unit tests and one compile with the
      # library it ships.
      - name: Build the rocket-compiler .deb
        if: inputs.target == 'compiler-host'
        run: .github/scripts/build-debs.sh compiler dist-deb

      # Installed the way a user installs it, then debian/tests/smoke: an
      # empty-environment compile that must find the packaged library and
      # spec under /usr. The checkout's own spec is still present, so the
      # test's check that --no-offload derived from /usr/share is what proves
      # the packaged lookup.
      - name: Install and test the rocket-compiler .deb
        if: inputs.target == 'compiler-host'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ./dist-deb/rocket-compiler_*.deb
          dpkg -L rocket-compiler
          AUTOPKGTEST_TMP="$(mktemp -d)" sh debian/tests/smoke

      - name: Upload the rocket-compiler .deb
        if: inputs.target == 'compiler-host'
        uses: actions/upload-artifact@v4
        with:
          name: rocket-compiler-deb-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
          path: dist-deb/*.deb
          retention-days: ${{ inputs.retention-days }}

      # --------------------------------------------------------- runtime-deb

      - name: Build the runtime .debs
        if: inputs.target == 'runtime-deb'
        env:
          ROCKET_IREE_CMAKE_ARGS: >-
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        run: .github/scripts/build-debs.sh runtime dist-deb

      # The arm64 runner has no NPU, so these are the CPU-device and link
      # halves of the board checks: rocket-run-module and IREE's own runner
      # on a VMVX module, and the C++ sample built through both .pc files and
      # find_package(IreeRocketRuntime).
      - name: Install and test the runtime .debs
        if: inputs.target == 'runtime-deb'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            ./dist-deb/libiree-rocket-runtime*.deb ./dist-deb/iree-rocket-tools_*.deb
          for t in runtime-smoke runtime-link; do
            echo "== debian/tests/$t"
            AUTOPKGTEST_TMP="$(mktemp -d)" sh "debian/tests/$t"
          done

      - name: Upload the runtime .debs
        if: inputs.target == 'runtime-deb'
        uses: actions/upload-artifact@v4
        with:
          name: iree-rocket-runtime-debs-arm64
          path: dist-deb/*.deb
          retention-days: ${{ inputs.retention-days }}

      # ------------------------------------------------------------- aarch64

      - name: Download host tools
        if: inputs.target == 'runtime-aarch64'
        uses: actions/download-artifact@v4
        with:
          name: iree-host-tools
          path: host-tools-dl

      - name: Restore host tools into iree-build/build
        if: inputs.target == 'runtime-aarch64'
        run: |
          set -euo pipefail
          mkdir -p iree-build/build
          tar -xzf host-tools-dl/iree-host-tools.tar.gz -C host-tools-dl
          # configure-runtime-aarch64.sh hardcodes IREE_HOST_BIN_DIR as
          # <iree-build>/build/tools, so the layout has to be reproduced
          # exactly rather than pointed at wherever the download landed.
          cp -a host-tools-dl/iree-host-tools/tools iree-build/build/tools
          cp -a host-tools-dl/iree-host-tools/lib   iree-build/build/lib
          rm -rf host-tools-dl
          ./iree-build/build/tools/iree-compile --version

      - name: Configure (runtime-aarch64)
        if: inputs.target == 'runtime-aarch64'
        run: |
          ./iree-build/configure-runtime-aarch64.sh \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DIREE_ENABLE_WERROR_FLAG=OFF
        # IREE defaults -Werror ON. configure-compiler-host.sh already turns it
        # off for the same reason it is turned off here: the runner's
        # aarch64-linux-gnu-g++ is not the one this is developed against, and a
        # nightly whose job is to produce board binaries should not fail on a
        # new warning from a compiler bump in the runner image.

      - name: Build (runtime-aarch64)
        if: inputs.target == 'runtime-aarch64'
        run: cmake --build iree-build/host-aarch64/build

      # Built separately from the CMake tree: the CMake build links
      # rocket-hal-driver in as a staticlib, it never builds the crates' own
      # #[test] binaries. These are the ones that get scp'd to the board.
      - name: Build Rust test binaries (aarch64)
        if: inputs.target == 'runtime-aarch64'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          cargo test --workspace --release \
            --target aarch64-unknown-linux-gnu --no-run \
            --message-format=json > cargo-tests.json
          jq -r 'select(.reason == "compiler-artifact" and .target.test == true and .executable != null) | .executable' \
            cargo-tests.json > rust-test-binaries.txt
          echo "Built $(wc -l < rust-test-binaries.txt) test binaries:"
          cat rust-test-binaries.txt

      - name: Package runtime-aarch64 artifacts
        if: inputs.target == 'runtime-aarch64'
        env:
          MAX_GLIBC: ${{ inputs.max-glibc }}
        run: |
          set -euo pipefail
          BUILD=iree-build/host-aarch64/build

          write_version() {
            cat > "$1" <<EOF
          repo:     ${{ github.repository }}@${{ github.sha }}
          iree-src: ${{ steps.pin.outputs.iree_sha }} (${{ steps.pin.outputs.iree_describe }})
          target:   aarch64-unknown-linux-gnu (RK3588)
          built:    $(date -u +%Y-%m-%dT%H:%M:%SZ)
          run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          }

          # 1. The board runtime tools.
          mkdir -p dist/iree-runtime-aarch64/bin
          cp "${BUILD}/iree/tools/iree-run-module" \
             "${BUILD}/iree/tools/iree-benchmark-module" \
             dist/iree-runtime-aarch64/bin/
          write_version dist/iree-runtime-aarch64/VERSION.txt
          tar -C dist -czf iree-runtime-aarch64.tar.gz iree-runtime-aarch64

          # 2. The HAL CTS binaries for the rocket driver.
          mkdir -p dist/rocket-cts-aarch64/bin
          find "${BUILD}/rocket-cts" -maxdepth 1 -type f -executable \
            -exec cp {} dist/rocket-cts-aarch64/bin/ \;
          write_version dist/rocket-cts-aarch64/VERSION.txt
          cat > dist/rocket-cts-aarch64/RUN.md <<'EOF'
          # rocket HAL CTS (aarch64 / RK3588)

          Cross-compiled against the real `rocket` HAL driver. Run on the board
          with the NPU present (`/dev/accel/accel0`):

          ```sh
          for t in bin/*; do
            echo "== $t"
            "./$t" || echo "FAILED: $t"
          done
          ```

          Only the non-executable CTS categories are built
          (buffer/command_buffer/core/file/queue) -- see
          `rocket-hal-driver/cts/backends.cc` for why.
          EOF
          tar -C dist -czf rocket-cts-aarch64.tar.gz rocket-cts-aarch64

          # 3. The Rust test binaries.
          mkdir -p dist/rocket-rust-tests-aarch64/bin
          while read -r bin; do
            [ -n "$bin" ] || continue
            cp "$bin" dist/rocket-rust-tests-aarch64/bin/
          done < rust-test-binaries.txt
          write_version dist/rocket-rust-tests-aarch64/VERSION.txt
          cat > dist/rocket-rust-tests-aarch64/RUN.md <<'EOF'
          # Rust test binaries (aarch64 / RK3588)

          `cargo test --workspace --release --target aarch64-unknown-linux-gnu
          --no-run` output for `rocket-schema`, `iree-rocket-hal` and
          `rocket-hal-driver`. Each file in `bin/` is a standalone libtest
          binary; the filename suffix is cargo's build hash.

          The hardware tests -- the ones that actually touch
          `/dev/accel/accel0` -- are all `#[ignore]`d, so a plain run only
          covers the host-safe unit tests. On the board, run both:

          ```sh
          for t in bin/*; do
            echo "== $t"
            "./$t"            || echo "FAILED: $t"
            "./$t" --ignored  || echo "FAILED (hardware): $t"
          done
          ```
          EOF
          tar -C dist -czf rocket-rust-tests-aarch64.tar.gz rocket-rust-tests-aarch64

          # 4. The embeddable runtime: rocket/runtime.h, IREE's headers,
          # libiree_rocket_runtime.{so,a}, pkg-config and CMake package files
          # (rocket-runtime/CMakeLists.txt). --strip only touches the .so; the
          # archive's debug info was already dropped when it was merged.
          cmake --install "${BUILD}" --component IreeRocketRuntime \
            --prefix dist/iree-rocket-runtime-aarch64 --strip
          write_version dist/iree-rocket-runtime-aarch64/VERSION.txt
          tar -C dist -czf iree-rocket-runtime-aarch64.tar.gz iree-rocket-runtime-aarch64

          # Same guard as compiler-host's: the board's glibc is the ceiling.
          .github/scripts/check-glibc-ceiling.sh "${MAX_GLIBC}" \
            dist/iree-runtime-aarch64 dist/rocket-cts-aarch64 \
            dist/rocket-rust-tests-aarch64 dist/iree-rocket-runtime-aarch64

          ls -lh ./*.tar.gz

      # The package as an outside program sees it: the shipped C++ sample,
      # cross-compiled from the unpacked tree through each pkg-config file,
      # and the Rust bindings built against it.
      # Link-only -- the runner cannot execute aarch64, and the board run is
      # what checks results.
      - name: Link-test the runtime package (aarch64)
        if: inputs.target == 'runtime-aarch64'
        run: |
          set -euo pipefail
          PKG="$(mktemp -d)"
          tar -xzf iree-rocket-runtime-aarch64.tar.gz -C "${PKG}"
          ROOT="${PKG}/iree-rocket-runtime-aarch64"
          export PKG_CONFIG_LIBDIR="${ROOT}/lib/pkgconfig" PKG_CONFIG_PATH=
          for pc in iree-rocket-runtime iree-rocket-runtime-static; do
            aarch64-linux-gnu-g++ -std=c++17 -O2 \
              "${ROOT}/share/rocket-runtime/samples/embed.cc" \
              $(pkg-config --cflags --libs "${pc}") -o "${PKG}/embed-${pc}"
            echo "linked against ${pc}: $(stat -c %s "${PKG}/embed-${pc}") bytes"
          done
          # The Rust bindings (rocket-runtime/rust) against the same unpacked
          # package: bindgen over its headers, every target linked to its .so.
          ROCKET_RUNTIME_DIR="${ROOT}" \
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --manifest-path rocket-runtime/rust/Cargo.toml \
              --target aarch64-unknown-linux-gnu --all-targets \
              --features rocket-runtime/half

      - name: Upload iree runtime (aarch64)
        if: inputs.target == 'runtime-aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: iree-runtime-aarch64
          path: iree-runtime-aarch64.tar.gz
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

      - name: Upload embeddable runtime package (aarch64)
        if: inputs.target == 'runtime-aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: iree-rocket-runtime-aarch64
          path: iree-rocket-runtime-aarch64.tar.gz
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

      - name: Upload rocket CTS (aarch64)
        if: inputs.target == 'runtime-aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: rocket-cts-aarch64
          path: rocket-cts-aarch64.tar.gz
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

      - name: Upload Rust test binaries (aarch64)
        if: inputs.target == 'runtime-aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: rocket-rust-tests-aarch64
          path: rocket-rust-tests-aarch64.tar.gz
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

      # ---------------------------------------------------------------- wrap

      - name: ccache stats
        # Runs on failure too -- a build that died partway still says how much
        # of the cache it hit, which is the first thing to check when a nightly
        # unexpectedly takes hours.
        if: always()
        run: |
          command -v ccache >/dev/null || exit 0
          ccache --show-stats --verbose
          {
            echo "### ccache (${{ inputs.target }})"
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Guarded on the restore having run: cache/save errors on an empty key,
      # which would turn an early failure (bad checkout, say) into two.
      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
