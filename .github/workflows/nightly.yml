name: Nightly artifacts

# Builds the things this repo exists to produce -- the compiler
# (rocket-compiler plus iree-compile, sharing a libIREECompiler.so with the
# Rocket target plugin), iree-run-module/iree-benchmark-module for the RK3588
# board, the embeddable runtime library for programs that run models
# themselves, and the board test binaries -- and attaches them to the run.
#
# Artifacts (each a single .tar.gz, so executable bits survive, except the
# .debs, which carry their own permissions):
#   iree-compile-x86_64        bin/rocket-compiler, bin/iree-compile,
#                              bin/iree-lld, lib/libIREECompiler.so,
#                              share/rocket/<transform spec>; unpack anywhere
#                              and run bin/rocket-compiler, no env needed.
#   iree-host-tools            the full host tools/ dir, for the aarch64 job.
#   iree-runtime-aarch64       iree-run-module, iree-benchmark-module.
#   iree-rocket-runtime-aarch64  the embeddable runtime: rocket/runtime.h,
#                              libiree_rocket_runtime.{so,a}, pkg-config and
#                              CMake package files (rocket-runtime/).
#   rocket-cts-aarch64         rocket HAL CTS binaries.
#   rocket-rust-tests-aarch64  the crates' libtest binaries.
#   rocket-compiler-deb-amd64  the rocket-compiler .deb, from compiler-host's
#                              IREE build.
#   iree-rocket-runtime-debs-arm64  libiree-rocket-runtime<N>, -dev and
#                              iree-rocket-tools (see debian/README.source).
# All are built on a pinned runner image and need glibc 2.39 at most (the
# `runner` / `max-glibc` inputs of iree-build.yml), so they load on both the
# developer host and the board. The .debs are built on ubuntu-24.04 too, so
# their Depends are noble's: they install on noble and on Debian 13, not on
# older suites (debian/README.source, "One build per suite").
#
# All three jobs share iree-build.yml. runtime-aarch64 `needs:` compiler-host
# because configure-runtime-aarch64.sh imports the host tools from that job's
# build (IREE_HOST_BIN_DIR); see iree-build.yml for how they are handed over.
# runtime-deb needs nothing and runs alongside.
#
# There is no native arm64 compiler job (iree-compile-aarch64,
# rocket-compiler-deb-arm64). It was dropped in 2026-11: a cold LLVM build on
# the 4-core ubuntu-24.04-arm runner took 2h40m+, the runner died before the
# end in two of three runs ("lost communication" / "shutdown signal" at
# 8347/8543, consistent with memory starvation), and a run that dies never
# reaches Save ccache, so every run started cold again. iree-build.yml still
# accepts `target: compiler-host` with `runner: ubuntu-24.04-arm` for a
# one-off workflow_dispatch from a branch.

on:
  schedule:
    # 07:00 UTC. GitHub disables scheduled workflows on repos with no activity
    # for 60 days, and only runs them from the default branch.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      retention-days:
        description: "How long to keep the artifacts"
        required: false
        default: "14"
        type: string

permissions:
  contents: read

# A nightly that overlaps the previous one just fights it for the shared
# ccache; let the newer commit win.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-host:
    uses: ./.github/workflows/iree-build.yml
    with:
      target: compiler-host
      retention-days: ${{ fromJSON(inputs.retention-days || '14') }}

  # The runtime's .debs, built natively on arm64 with no LLVM (the
  # pkg.iree-rocket.nocompiler profile), then installed and tested on the
  # CPU device. Minutes, not hours.
  runtime-deb:
    uses: ./.github/workflows/iree-build.yml
    with:
      target: runtime-deb
      runner: ubuntu-24.04-arm
      timeout-minutes: 60
      retention-days: ${{ fromJSON(inputs.retention-days || '14') }}

  runtime-aarch64:
    needs: compiler-host
    uses: ./.github/workflows/iree-build.yml
    with:
      target: runtime-aarch64
      # No LLVM here -- this is IREE's runtime plus its test suite, so it
      # finishes in a fraction of the compiler build's time even cold.
      timeout-minutes: 120
      retention-days: ${{ fromJSON(inputs.retention-days || '14') }}
