name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rocket-hal-driver and iree-rocket-hal both bindgen C headers at
      # build time (vendor/iree-headers, rkt_registers.h) and need libclang.
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustfmt.toml sets imports_granularity, which is still unstable and
      # only honored by nightly rustfmt -- stable would silently ignore it
      # and could disagree with how the code was actually formatted.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
