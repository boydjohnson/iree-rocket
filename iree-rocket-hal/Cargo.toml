[package]
name = "iree-rocket-hal"
version = "0.1.0"
edition = "2024"

[features]
# Includes hardware tests that require the upstream kernel completion fix.
# These tests remain `#[ignore]`, so running them also requires `--ignored`.
kernel-fix = []
# Keeps deliberately failing, raw, or timeout-prone RK3588 characterization
# probes out of the normal `--include-ignored` hardware regression gate.
# Enable only when re-measuring unsupported register programs.
hardware-characterization = []

[dependencies]
nix = { version = "0.30.1", features = ["ioctl", "mman", "time"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[build-dependencies]
bindgen = "0.72.1"
cc = "1.2.48"
