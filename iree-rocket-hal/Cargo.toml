[package]
name = "iree-rocket-hal"
version = "0.1.0"
edition = "2024"

[features]
# Includes hardware tests that require the upstream kernel completion fix.
# These tests remain `#[ignore]`, so running them also requires `--ignored`.
kernel-fix = []

# Restores the pooling geometries that rknn-toolkit2 compiles with a
# CNA|CORE|DPU (0x0d) layout stage in front of the PPU kick, rather than the
# bare 0x60 that `PoolingPlan` emits. Off by default so the hardware suite
# covers only shapes whose vendor program matches ours structurally.
vendor-bypass-shapes = []

[dependencies]
nix = { version = "0.30.1", features = ["ioctl", "mman", "time"] }


[build-dependencies]
bindgen = "0.72.1"
cc = "1.2.48"
